{% extends "base.html" %}

{% block title %}404 — Page Not Found — AIToolHub{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <h2 style="font-family:var(--font-display);font-size:1.8rem;letter-spacing:-0.02em;margin-bottom:10px;">Page not found</h2>
  <p style="color:var(--text-secondary);margin-bottom:28px;">
    The page or tool you're looking for doesn't exist or has been moved.
  </p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <a href="/" class="btn btn-primary">Go Home</a>
    <a href="/tools" class="btn btn-ghost">Browse Tools</a>
  </div>
</div>
{% endblock %}
